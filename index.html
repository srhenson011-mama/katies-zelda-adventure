<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%9A%3C/text%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katie's Big Zelda Adventure 🧚</title>
<style>
:root{--bg1:#0d1f17;--bg2:#1a1636;--card:#18302a;--card2:#21203f;--ink:#f4f1ff;--soft:#c9d8cf;--leaf:#5fe0a0;--leaf2:#2fa873;--glow:#ffe66d;--fairy:#c49bff;--pink:#ff8fd0;--line:#3e6b57;--radius:22px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Comic Sans MS","Chalkboard SE","Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);font-size:19px;line-height:1.4;
background:radial-gradient(ellipse at 20% 0%,#2b5a45 0%,transparent 55%),radial-gradient(ellipse at 90% 30%,#3b2b6b 0%,transparent 50%),linear-gradient(180deg,var(--bg1) 0%,#12261f 45%,var(--bg2) 100%);background-attachment:fixed;min-height:100vh}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:radial-gradient(3px 3px at 10% 20%,#fff7a8,transparent),radial-gradient(2px 2px at 30% 70%,#fff7a8,transparent),radial-gradient(3px 3px at 70% 15%,#d9c2ff,transparent),radial-gradient(2px 2px at 85% 60%,#fff7a8,transparent),radial-gradient(2px 2px at 55% 85%,#d9c2ff,transparent),radial-gradient(3px 3px at 45% 40%,#fff7a8,transparent);
animation:twinkle 4s ease-in-out infinite alternate;opacity:.8}
body::after{transform:translate(4%,6%) scale(1.1);animation-delay:2s;opacity:.5}
@keyframes twinkle{0%{opacity:.25}100%{opacity:.9}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
header{position:relative;z-index:1;text-align:center;padding:22px 12px 6px}
.homelink{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:999px;background:#0f2019;border:2px solid var(--leaf);color:var(--ink);font-weight:bold;font-size:15px;text-decoration:none;box-shadow:0 0 10px #5fe0a066;z-index:3}
@media (max-width:560px){header{padding-top:62px}}
.leafy{display:block;margin:0 auto;width:min(420px,90%);height:34px}
h1{margin:4px 0 0;font-size:clamp(28px,7vw,48px);color:var(--glow);text-shadow:0 0 14px #ffe66d88,0 3px 0 #2a4b3b}
.sub{font-size:17px;margin:6px 0;color:var(--soft)}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 12px 130px}
.panel,.overall{background:linear-gradient(160deg,var(--card),var(--card2));border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0 18px;box-shadow:0 0 0 4px #ffffff08,0 10px 30px #0008}
.bar{height:28px;background:#0b1712;border:2px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf2),var(--leaf),var(--glow));box-shadow:0 0 14px var(--leaf);transition:width .5s}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;color:#fff;text-shadow:0 1px 2px #000}

html{background:#0d1f17}body{min-height:100vh;background-attachment:fixed}
.tile .trow{margin-top:18px}
.total{display:inline-block;margin:10px auto 0;font-size:22px;font-weight:bold;padding:10px 18px;border-radius:999px;background:linear-gradient(90deg,#6b4a00,#c99a12,#6b4a00);border:2px solid var(--glow);box-shadow:0 0 16px #ffe66d88;color:#fff8d6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:26px;background:linear-gradient(160deg,var(--card),var(--card2));border:2px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer;font:inherit;text-align:left;box-shadow:0 6px 18px #0006;transition:transform .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px)}
.tile.featured{grid-column:1/-1;border-color:var(--leaf);box-shadow:0 0 22px #5fe0a066}
.tile.done{background:radial-gradient(circle at 30% 0,#ffe66d33,transparent 60%),linear-gradient(160deg,#4a3a0c,#2a2440);border-color:var(--glow);box-shadow:0 0 22px #ffe66d55}
.art{width:96px;height:96px;flex:none}
.trow{display:flex;gap:14px;align-items:center}
.tname{font-size:24px;font-weight:bold;line-height:1.2}
.tmeta{font-size:15px;color:var(--soft)}
.tstat{font-size:16px;color:#fff3c4}
.tag{position:absolute;top:12px;right:12px;font-size:14px;font-weight:bold;padding:4px 10px;border-radius:999px;background:var(--leaf);color:#0c2a1c}
.done .tag{background:var(--glow);color:#4a3200}
.go{align-self:flex-start;font-weight:bold;padding:10px 16px;border-radius:999px;background:linear-gradient(180deg,#fff3a3,var(--glow));color:#3a2a00;min-height:44px;display:inline-flex;align-items:center}
.cele{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.cele.show{display:flex}
.card{max-width:420px;width:100%;text-align:center;padding:24px;border-radius:28px;background:radial-gradient(circle at 50% 0,#ffe66d44,transparent 60%),linear-gradient(160deg,#4a3a0c,#2a2440);border:3px solid var(--glow);box-shadow:0 0 30px #ffe66d88}
.card h2{color:var(--glow);font-size:28px;margin:8px 0}
.card button{font:inherit;font-size:18px;font-weight:bold;min-height:48px;padding:10px 20px;border:none;border-radius:999px;background:var(--leaf);color:#0c2a1c;cursor:pointer;margin-top:12px}
.big{font-size:56px}
@media (max-width:560px){.tile.featured .art{width:80px;height:80px}.tname{font-size:21px}}
</style>
</head>

    var p = g.complete ? {pct: 100} : (g.id === "minish" ? minishProgress() : {pct: 0});
    if(g.complete || p.pct >= 100) beaten++;
    var t = el(g.tracker ? "a" : "button", "tile" + (g.complete ? " done" : "") + (!g.complete && i === 0 ? " featured" : ""));
    t.dataset.game = g.id; if(g.tracker) t.href = g.href; else t.type = "button";
    t.appendChild(el("span", "tag", g.complete ? "🏆 Beat it!" : "⭐ Playing now"));
    var row = el("div", "trow"); var a = el("div"); a.innerHTML = ART[g.art]; row.appendChild(a.firstChild);
    var tx = el("div"); tx.appendChild(el("div", "tname", g.name)); tx.appendChild(el("div", "tmeta", g.meta)); row.appendChild(tx); t.appendChild(row);
    var bar = el("div", "bar"); var fill = el("i"); fill.style.width = p.pct + "%"; bar.appendChild(fill); bar.appendChild(el("span", null, p.pct + "%")); t.appendChild(bar);
    if(g.complete){ t.appendChild(el("div", "tstat", "✨ 100% complete! Tap to celebrate!")); t.addEventListener("click", function(){ cele(g); }); }
    else if(g.id === "minish"){
      var st = el("div", "tstat"); st.dataset.src = p.src;
      st.textContent = p.icon + " " + (p.chNum ? "Chapter " + p.chNum + ": " + p.chapter + " · " : "") + p.section + " · ❤️ " + p.hearts + " hearts";
      t.appendChild(st); t.appendChild(el("span", "go", "▶️ Keep playing"));
    }
    grid.appendChild(t);
  });
  document.getElementById("total").textContent = "🏆 " + beaten + " game" + (beaten === 1 ? "" : "s") + " beaten!";
}
function cele(g){
  document.getElementById("ctitle").textContent = g.name + " — beaten!";
  document.getElementById("ctext").textContent = g.cheer + " Way to go, Katie! 🎉";
  document.getElementById("cele").classList.add("show");
}
document.getElementById("cclose").onclick = function(){ document.getElementById("cele").classList.remove("show"); };
document.getElementById("cele").addEventListener("click", function(e){ if(e.target === this) this.classList.remove("show"); });
window.addEventListener("pageshow", render); window.addEventListener("storage", render);
render();
</script>
</body>
